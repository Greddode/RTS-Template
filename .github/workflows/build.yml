# Builds the RTS Kit on GitHub's machines every time you push (Actions tab on GitHub).
#
# - Linux: inside clean Ubuntu containers, installing exactly the packages the README lists,
#   then starting the game for 10 seconds on a virtual screen. This is what a buyer does.
# - Web: Emscripten, then `make web-zip`; the zip is attached to the run.
# - Windows and macOS: not supported yet. These jobs only show what fails, so we know
#   what porting needs. A red cross there is expected for now.
#
# Every job runs even if another fails (fail-fast: false), and the builds are attached to
# the run as artifacts (bottom of the run's page).

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button on GitHub

jobs:
  linux:
    name: Linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}   # a clean distro, not GitHub's pre-loaded machine
    strategy:
      fail-fast: false
      matrix:
        image: [ "ubuntu:24.04", "ubuntu:22.04" ]
    steps:
      - name: Install the packages from the README (Ubuntu / Debian line)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git python3 \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
          cmake --version | head -1
      - uses: actions/checkout@v4
      - name: Build (make desktop)
        run: make desktop
      - name: Start the game for 10 seconds on a virtual screen
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb xauth libgl1-mesa-dri
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 10 ./build/game > game.log 2>&1
          code=$?
          tail -n 25 game.log
          grep -q "PERF:" game.log || { echo "::error::The game didn't reach its main loop"; exit 1; }
          [ "$code" -eq 124 ] || { echo "::error::The game stopped early (exit code $code)"; exit 1; }
          echo "The game ran for 10 seconds."
      - uses: actions/upload-artifact@v4
        with:
          name: game-linux-${{ strategy.job-index }}
          path: build/game

  web:
    name: Web (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build and zip (make web-zip)
        run: make web-zip
      - uses: actions/upload-artifact@v4
        with:
          name: rts-kit-web
          path: build-web/rts-kit-web.zip

  windows-msvc:
    name: Windows, Visual Studio (not supported yet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: game-windows-msvc
          path: build/Release/game.exe

  windows-mingw:
    name: Windows, MinGW gcc (not supported yet)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CMAKE_GENERATOR: MSYS Makefiles   # works with the plain `make` installed below
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
      - uses: actions/checkout@v4
      - name: Build (make desktop)
        run: make desktop
      - uses: actions/upload-artifact@v4
        with:
          name: game-windows-mingw
          path: build/game.exe

  macos:
    name: macOS (not supported yet)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (make desktop)
        run: make desktop
      - uses: actions/upload-artifact@v4
        with:
          name: game-macos
          path: build/game
